[pytest]
# Only collect tests/ — this keeps pytest out of any stale nested copy of
# the project (e.g. an older zip extracted with a top-level farm-aid/
# folder inside the project) so no duplicate test modules are ever picked
# up. No manual folder deletion required.
testpaths = tests
norecursedirs = .git .venv venv __pycache__ .pytest_cache *.egg-info farm-aid